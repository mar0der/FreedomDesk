[workspace]
resolver = "2"
members = [
    "crates/fd-proto",
    "crates/fd-crypto",
    "crates/fd-capture",
    "crates/fd-codec",
    "crates/fd-input",
    "crates/freedomdesk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/mar0der/FreedomDesk"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
snow = "0.10"
sha2 = "0.10"
data-encoding = "2"
zeroize = "1"
directories = "6"
clap = { version = "4", features = ["derive"] }
x11rb = { version = "0.13", features = ["shm", "xtest", "xkb", "damage", "xfixes", "randr"] }
libc = "0.2"
serde_json = "1"
png = "0.18"
ctrlc = { version = "3", features = ["termination"] }
arboard = { version = "3", default-features = false }
openh264 = "0.9"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

fd-proto = { path = "crates/fd-proto" }
fd-crypto = { path = "crates/fd-crypto" }
fd-capture = { path = "crates/fd-capture" }
fd-codec = { path = "crates/fd-codec" }
fd-input = { path = "crates/fd-input" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Video conversion / codec code is unusable unoptimised; keep dev builds snappy.
[profile.dev.package."*"]
opt-level = 2
