name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x86_64 (host + viewer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nasm libx11-dev libxcb1-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release -p freedomdesk --locked
      - name: Package
        run: |
          mkdir -p dist
          tar -C target/release -czf dist/freedomdesk-linux-x86_64.tar.gz freedomdesk
          (cd dist && sha256sum freedomdesk-linux-x86_64.tar.gz > freedomdesk-linux-x86_64.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: freedomdesk-linux-x86_64
          path: dist/*

  macos:
    name: macOS aarch64 (viewer)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: brew install nasm || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Host-side crates compile to "unsupported" stubs on macOS; test the portable ones.
      - run: cargo test --locked -p fd-proto -p fd-crypto -p fd-codec -p freedomdesk
      - run: cargo build --release -p freedomdesk --locked
      - name: Smoke
        run: |
          ./target/release/freedomdesk --version
          ./target/release/freedomdesk --config-dir "$RUNNER_TEMP/fd" id
          if ./target/release/freedomdesk --config-dir "$RUNNER_TEMP/fd" host --bind 127.0.0.1; then exit 1; fi
      - name: Package
        run: |
          mkdir -p dist
          tar -C target/release -czf dist/freedomdesk-macos-aarch64.tar.gz freedomdesk
          (cd dist && shasum -a 256 freedomdesk-macos-aarch64.tar.gz > freedomdesk-macos-aarch64.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: freedomdesk-macos-aarch64
          path: dist/*

  release:
    name: GitHub Release (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "FreedomDesk $GITHUB_REF_NAME" \
            --notes "Pre-release. Linux x86_64 host+viewer, macOS aarch64 viewer. Unsigned builds; verify the .sha256 files. See docs/TESTING.md."
